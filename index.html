<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EduFlow • Dein Schulportal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --a1:#6366f1; --a2:#8b5cf6;
  --bg:#eef1f8; --card:rgba(255,255,255,.78); --card-solid:#fff; --inset:rgba(99,102,241,.06);
  --text:#0f172a; --muted:#64748b; --line:rgba(100,116,139,.18);
  --red:#f43f5e; --amber:#f59e0b; --green:#10b981; --blue:#0ea5e9;
  --shadow:0 12px 40px -12px rgba(30,41,90,.18);
  --r-xl:28px; --r-lg:20px; --r-md:14px;
  --grad:linear-gradient(135deg,var(--a1),var(--a2));
}
[data-theme="dark"]{
  --bg:#070a14; --card:rgba(20,26,46,.72); --card-solid:#141b2e; --inset:rgba(255,255,255,.045);
  --text:#f1f5f9; --muted:#94a3b8; --line:rgba(255,255,255,.08);
  --shadow:0 14px 44px -14px rgba(0,0,0,.65);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:110px;transition:background .4s,color .4s;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Aurora-Hintergrund */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;animation:float 22s ease-in-out infinite}
.aurora i:nth-child(1){width:520px;height:520px;background:var(--a1);top:-160px;left:-120px}
.aurora i:nth-child(2){width:460px;height:460px;background:var(--a2);top:30%;right:-160px;animation-delay:-7s}
.aurora i:nth-child(3){width:420px;height:420px;background:#22d3ee;bottom:-180px;left:25%;animation-delay:-13s;opacity:.25}
[data-theme="dark"] .aurora i{opacity:.22}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,40px) scale(1.1)}66%{transform:translate(-40px,60px) scale(.95)}}

.shell{max-width:1180px;margin:0 auto;padding:22px 18px}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:50px;height:50px;border-radius:17px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:1.5rem;box-shadow:0 10px 24px -6px var(--a1)}
.brand h1{font-size:1.4rem;font-weight:800;letter-spacing:-.6px}
.brand p{font-size:.82rem;color:var(--muted);font-weight:500}
.tools{display:flex;gap:9px;align-items:center}
.round{width:46px;height:46px;border-radius:50%;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);display:grid;place-items:center;font-size:1.2rem;box-shadow:var(--shadow);transition:transform .2s}
.round:hover{transform:translateY(-2px)} .round:active{transform:scale(.92)}
.swatch{width:20px;height:20px;border-radius:50%;background:var(--grad)}
.chip{display:flex;align-items:center;gap:10px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);padding:6px 16px 6px 6px;border-radius:99px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow);transition:transform .2s}
.chip:hover{transform:translateY(-2px)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:800}

/* Views */
.view{display:none}
.view.active{display:block;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
.card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:var(--r-xl);padding:24px;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.card-title{display:flex;align-items:center;gap:11px;font-weight:800;font-size:1.08rem}
.ti{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:1.15rem;background:var(--inset);color:var(--a1)}
.ti.red{background:rgba(244,63,94,.13);color:var(--red)} .ti.amber{background:rgba(245,158,11,.14);color:var(--amber)} .ti.green{background:rgba(16,185,129,.14);color:var(--green)} .ti.blue{background:rgba(14,165,233,.14);color:var(--blue)}

/* Hero */
.hero{position:relative;overflow:hidden;background:var(--grad);color:#fff;border-radius:var(--r-xl);padding:32px;margin-bottom:18px;box-shadow:0 22px 50px -16px var(--a1);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:300px;height:300px;right:-80px;top:-140px}
.hero::after{width:200px;height:200px;right:140px;bottom:-130px}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:800;letter-spacing:-.7px;margin-bottom:6px}
.hero p{opacity:.92;font-weight:500}
.next{background:rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.28);border-radius:var(--r-lg);padding:16px 22px;min-width:250px}
.next small{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.9px;font-weight:700;opacity:.85}
.next b{display:block;font-size:1.2rem;font-weight:800;margin:3px 0}
.next .count{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.55rem;letter-spacing:-.5px}

/* Stat tiles */
.stat{display:flex;align-items:center;gap:15px;padding:20px}
.stat .num{font-size:1.9rem;font-weight:800;letter-spacing:-1px;line-height:1}
.stat .lbl{font-size:.82rem;color:var(--muted);font-weight:600;margin-top:4px}
.stat .ti{width:52px;height:52px;border-radius:17px;font-size:1.4rem}
.card.lift:hover{transform:translateY(-4px)}

/* Items */
.item{display:flex;align-items:center;gap:13px;padding:14px 15px;border-radius:var(--r-lg);background:var(--inset);margin-bottom:10px;transition:transform .2s,background .2s}
.item:hover{transform:translateX(3px)}
.item .body{flex:1;min-width:0}
.item .body strong{display:block;font-size:.95rem;overflow:hidden;text-overflow:ellipsis}
.item .body small{display:block;color:var(--muted);font-size:.8rem;font-weight:500;margin-top:2px}
.time{background:var(--card-solid);border-radius:13px;padding:8px 11px;font-weight:800;font-size:.8rem;min-width:64px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);font-variant-numeric:tabular-nums}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.tag{padding:5px 12px;border-radius:99px;font-size:.75rem;font-weight:800;white-space:nowrap}
.t-red{background:rgba(244,63,94,.13);color:var(--red)} .t-amber{background:rgba(245,158,11,.15);color:#d97706} .t-green{background:rgba(16,185,129,.14);color:#059669} .t-blue{background:var(--inset);color:var(--a1)} .t-gray{background:var(--inset);color:var(--muted)}
[data-theme="dark"] .t-amber{color:var(--amber)} [data-theme="dark"] .t-green{color:#34d399}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-weight:600;font-size:.92rem}
.empty .i{width:2.2em;height:2.2em;opacity:.45;display:block;margin:0 auto 8px}
.ghost{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--muted);transition:.2s;flex:none}
.ghost:hover{background:rgba(244,63,94,.13);color:var(--red)}

/* Forms */
.form{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.form input,.form select{flex:1 1 130px;min-width:0;padding:12px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card-solid);outline:none;font-size:.9rem;font-weight:500;transition:border .2s,box-shadow .2s}
.form input:focus,.form select:focus{border-color:var(--a1);box-shadow:0 0 0 4px var(--inset)}
.form .grow{flex:3 1 220px}
.btn{padding:12px 22px;border-radius:99px;background:var(--grad);color:#fff;font-weight:700;display:inline-flex;align-items:center;gap:7px;justify-content:center;box-shadow:0 8px 20px -8px var(--a1);transition:transform .2s}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:scale(.95)}
.btn.soft{background:var(--inset);color:var(--text);box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{padding:8px 16px;border-radius:99px;background:var(--inset);font-weight:700;font-size:.83rem;color:var(--muted);transition:.2s}
.fchip.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px -6px var(--a1)}

/* Tasks */
.task{cursor:pointer}
.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:.2s;background:var(--card-solid)}
.task.done .check{background:var(--grad);border-color:transparent;color:#fff;animation:pop .3s}
.task.done .body strong{text-decoration:line-through;opacity:.5}
@keyframes pop{50%{transform:scale(1.3)}}
.bar{height:10px;border-radius:99px;background:var(--inset);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.prio{width:4px;align-self:stretch;border-radius:4px;flex:none}

/* Timetable */
.tt-wrap{overflow-x:auto;margin:0 -6px;padding:0 6px 6px}
.tt{display:grid;grid-template-columns:62px repeat(5,minmax(112px,1fr));gap:8px;min-width:700px}
.tt .hd{text-align:center;font-weight:800;font-size:.85rem;padding:10px 4px;border-radius:14px;color:var(--muted)}
.tt .hd.today{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px var(--a1)}
.tt .tm{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);font-weight:700;line-height:1.3}
.tt .tm b{font-size:1rem;color:var(--text)}
.cell{position:relative;text-align:left;padding:11px 12px 11px 16px;border-radius:16px;background:var(--inset);min-height:74px;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:transform .2s,box-shadow .2s;overflow:hidden}
.cell::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:5px;border-radius:0 5px 5px 0;background:var(--c,transparent)}
.cell:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cell strong{font-size:.9rem}.cell small{font-size:.72rem;color:var(--muted);font-weight:600}
.cell.free{background:transparent;border:1.5px dashed var(--line);color:var(--muted);align-items:center;font-size:1.1rem}
.cell.cancel strong{text-decoration:line-through;opacity:.55}
.cell.cancel{background:rgba(244,63,94,.1)}
.cell.change{background:rgba(245,158,11,.12)}
.cell.now{box-shadow:0 0 0 2.5px var(--a1),0 10px 26px -8px var(--a1);animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--inset),0 10px 26px -8px var(--a1)}}
.cell .badge{position:absolute;top:8px;right:9px;font-size:.62rem;font-weight:800;padding:2px 7px;border-radius:99px}

/* Grades */
.ring{position:relative;width:170px;height:170px;margin:0 auto}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid b{font-size:2.5rem;font-weight:800;letter-spacing:-1.5px}
.ring .mid span{font-size:.78rem;color:var(--muted);font-weight:700}
.subj-row{display:grid;grid-template-columns:110px 1fr 56px;align-items:center;gap:12px;margin-bottom:13px;font-weight:700;font-size:.9rem}
.subj-row .bar{height:12px}
.gv{display:inline-grid;place-items:center;min-width:46px;height:34px;padding:0 10px;border-radius:12px;font-weight:800;font-size:.95rem}

/* Timer */
.timer{text-align:center}
.timer .big{font-size:3.1rem;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:6px 0 14px}
.timer .row{display:flex;gap:10px;justify-content:center}

/* Dock */
.dock{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:8px;background:var(--card);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:99px;box-shadow:0 20px 50px -10px rgba(0,0,0,.28);z-index:50;max-width:calc(100vw - 20px)}
.dk{display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:99px;color:var(--muted);font-weight:700;font-size:.88rem;transition:.3s}
.dk .i{font-size:1.25rem}
.dk:hover{color:var(--text)}
.dk.on{background:var(--grad);color:#fff;box-shadow:0 8px 20px -6px var(--a1)}
.dk .badge{background:var(--red);color:#fff;font-size:.68rem;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;padding:0 5px}

/* Dialog + Toast */
dialog{border:none;border-radius:var(--r-xl);padding:26px;background:var(--card-solid);color:var(--text);box-shadow:0 30px 80px -10px rgba(0,0,0,.45);width:min(420px,92vw);margin:auto}
dialog::backdrop{background:rgba(7,10,20,.5);backdrop-filter:blur(5px)}
dialog h3{margin-bottom:16px;font-weight:800}
dialog .form{flex-direction:column;margin:0 0 6px}
dialog .form input{flex:none}
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-90px);background:var(--card-solid);color:var(--text);padding:13px 22px;border-radius:99px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow);border:1px solid var(--line);z-index:200;transition:transform .45s cubic-bezier(.2,1.2,.3,1);display:flex;gap:9px;align-items:center}
.toast.show{transform:translate(-50%,0)}
.conf{position:fixed;width:9px;height:14px;border-radius:2px;z-index:300;pointer-events:none;animation:conf 1s ease-out forwards}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

@media(max-width:900px){
  .s8,.s7,.s6,.s5,.s4{grid-column:span 12}.s3{grid-column:span 6}
  .dk span{display:none}.dk.on span{display:inline}.dk{padding:12px 14px}
  .chip span{display:none}.chip{padding:6px}
  .brand p{display:none}
}
@media(max-width:520px){.shell{padding:16px 12px}.hero{padding:24px}.next{min-width:100%}.subj-row{grid-template-columns:84px 1fr 50px}.dk.on span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- Icon-Sprite (keine externen Dateien nötig) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>

  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></symbol>

</svg>

<div class="aurora"><i></i><i></i><i></i></div>
<div class="toast" id="toast"></div>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="logo"><svg class="i"><use href="#i-spark"/></svg></div>
      <div><h1>EduFlow</h1><p id="sub-line">Dein Schulportal</p></div>
    </div>
    <div class="tools">
      <button class="round" data-act="accent" title="Farbe wechseln"><span class="swatch"></span></button>
      <button class="round" data-act="theme" title="Hell / Dunkel" id="theme-btn"></button>
      <button class="chip" data-act="rename" title="Namen ändern"><div class="avatar" id="avatar">?</div><span id="uname"></span></button>
    </div>
  </header>

  <main>
    <section id="v-home" class="view active"></section>
    <section id="v-plan" class="view"></section>
    <section id="v-tasks" class="view"></section>
    <section id="v-exams" class="view"></section>
    <section id="v-grades" class="view"></section>
  </main>
</div>

<nav class="dock" id="dock">
  <button class="dk on" data-tab="home"><svg class="i"><use href="#i-home"/></svg><span>Übersicht</span></button>
  <button class="dk" data-tab="plan"><svg class="i"><use href="#i-cal"/></svg><span>Stundenplan</span></button>
  <button class="dk" data-tab="tasks"><svg class="i"><use href="#i-check"/></svg><span>Aufgaben</span><b class="badge" id="task-badge" hidden></b></button>
  <button class="dk" data-tab="exams"><svg class="i"><use href="#i-exam"/></svg><span>Klausuren</span></button>
  <button class="dk" data-tab="grades"><svg class="i"><use href="#i-award"/></svg><span>Noten</span></button>
</nav>

<dialog id="dlg">
  <h3 id="dlg-title">Stunde bearbeiten</h3>
  <form class="form" id="dlg-form" method="dialog">
    <input id="d-subj" list="subj-list" placeholder="Fach (z. B. Mathe)" autocomplete="off">
    <input id="d-room" placeholder="Raum (z. B. A102)" autocomplete="off">
    <input id="d-teacher" placeholder="Lehrkraft (z. B. Fr. Sommer)" autocomplete="off">
    <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">
      <button type="button" class="btn" data-act="slot-save" style="flex:1">Speichern</button>
      <button type="button" class="btn soft" data-act="slot-clear">Leeren</button>
      <button type="button" class="btn soft" data-act="slot-cancel">Abbrechen</button>
    </div>
  </form>
</dialog>
<datalist id="subj-list"></datalist>

<script>
/* ================= Helfer ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

/* ================= Schultag-Logik ================= */
function schoolDay(now=new Date()){
  let d=sod(now), wd=(d.getDay()+6)%7;
  const endToday=atTime(d,P[5][1]);
  if(wd>4||now>=endToday){do{d=addDays(d,1);wd=(d.getDay()+6)%7}while(wd>4)}
  return{date:d,day:wd,today:diff0(d,now)===0};
}
const diff0=(a,b)=>diffDays(a,b);
const subFor=(day,hour)=>state.subs.find(s=>s.day===day&&s.hour===hour);
function nextLesson(now=new Date()){
  const sd=schoolDay(now);
  for(let h=1;h<=6;h++){
    const c=state.tt[sd.day][h-1]; if(!c)continue;
    const sub=subFor(sd.day,h); if(sub&&sub.type==='Entfall')continue;
    const st=atTime(sd.date,P[h-1][0]), en=atTime(sd.date,P[h-1][1]);
    if(now<en)return{c,h,st,en,running:now>=st,sd,sub};
  }
  return null;
}
function dayName(d,now=new Date()){const n=diffDays(d,now);return n===0?'Heute':n===1?'Morgen':DAYS[(d.getDay()+6)%7]}
function dueLabel(s,now=new Date()){
  const n=diffDays(parseISO(s),now);
  if(n<0)return[n===-1?'Gestern fällig':`${-n} Tage überfällig`,'t-red'];
  if(n===0)return['Heute fällig','t-amber'];
  if(n===1)return['Morgen','t-amber'];
  if(n<7)return[`In ${n} Tagen`,'t-blue'];
  return[parseISO(s).toLocaleDateString('de-DE',{day:'2-digit',month:'short'}),'t-gray'];
}

/* ================= Berechnungen ================= */
function subjectAvg(sub){
  const g=state.grades.filter(x=>x.subject===sub); if(!g.length)return null;
  const w=g.reduce((a,x)=>a+x.weight,0); return g.reduce((a,x)=>a+x.value*x.weight,0)/w;
}
function overallAvg(){
  const list=[...new Set(state.grades.map(g=>g.subject))].map(subjectAvg).filter(v=>v!==null);
  return list.length?list.reduce((a,b)=>a+b,0)/list.length:null;
}
const openTasks=()=>state.tasks.filter(t=>!t.done);

const empty=(icon,t)=>`<div class="empty">${ic(icon)}${t}</div>`;
function ringSvg(pct,col,size=170,sw=14){
  const r=(size-sw)/2,c=2*Math.PI*r;
  return`<svg viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--inset)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(1,pct)))}" style="transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/></svg>`;
}
function subOptions(sel){return subjects().map(s=>`<option ${s===sel?'selected':''}>${esc(s)}</option>`).join('')}
function toast(msg,icon='spark'){const t=$('#toast');t.innerHTML=ic(icon)+esc(msg);t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2300)}
function confetti(x,y){
  const cols=['#6366f1','#ec4899','#f59e0b','#10b981','#0ea5e9','#f43f5e'];
  for(let i=0;i<26;i++){
    const e=document.createElement('i');e.className='conf';
    const a=Math.random()*Math.PI*2,d=60+Math.random()*110;
    e.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%6]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d+60}px;--r:${Math.random()*720-360}deg`;
    document.body.appendChild(e);setTimeout(()=>e.remove(),1050);
  }
}

function heroTick(){
  const l=$('#hl'); if(!l)return;
  const now=new Date(), nl=nextLesson(now);
  if(!nl){l.textContent='Nächste Stunde';$('#hs').textContent='Keine Stunde geplant';$('#hc').textContent='–';return}
  const target=nl.running?nl.en:nl.st, ms=Math.max(0,target-now);
  const dd=Math.floor(ms/864e5),hh=Math.floor(ms%864e5/36e5),mm=Math.floor(ms%36e5/6e4),ss=Math.floor(ms%6e4/1e3);
  const p=n=>String(n).padStart(2,'0');
  l.textContent=nl.running?'Läuft gerade • noch':`Nächste Stunde • ${dayName(nl.sd.date,now)}, ${P[nl.h-1][0]} Uhr`;
  $('#hs').textContent=`${nl.c.s} • ${nl.sub&&nl.sub.type==='Raumwechsel'?nl.sub.note:nl.c.r}`;
  $('#hc').textContent=dd?`${dd}T ${p(hh)}:${p(mm)}:${p(ss)}`:`${p(hh)}:${p(mm)}:${p(ss)}`;
}

    <section class="card s4" style="text-align:center">
      <div class="card-head" style="justify-content:center"><div class="card-title">Fortschritt</div></div>
      <div class="ring">${ringSvg(pct,'url(#g1)')}<div class="mid"><b>${Math.round(pct*100)}%</b><span>${done} von ${all.length} erledigt</span></div></div>
      <svg width="0" height="0"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--a1)"/><stop offset="1" stop-color="var(--a2)"/></linearGradient></defs></svg>
      <p style="margin-top:18px;color:var(--muted);font-weight:600;font-size:.9rem">${all.length-done?`Noch ${all.length-done} offen – du schaffst das! 💪`:'Alles geschafft! 🎉'}</p>
    </section></div>`;
}

function renderExams(){
  const now=new Date(), ex=[...state.exams].sort((a,b)=>a.date.localeCompare(b.date));
  $('#v-exams').innerHTML=`<div class="grid"><section class="card s12">
    <div class="card-head"><div class="card-title"><div class="ti red">${ic('exam')}</div>Klausuren & Tests</div></div>
    <form class="form" data-form="exam">
      <select name="subject">${subOptions('Mathe')}</select>
      <input class="grow" name="topic" placeholder="Thema (z. B. Quadratische Funktionen)" required autocomplete="off">
      <input type="date" name="date" value="${iso(addDays(now,7))}" required>
      <button class="btn">${ic('plus')}Eintragen</button>
    </form>
    ${ex.length?ex.map(e=>{const n=diffDays(parseISO(e.date),now),past=n<0;return`<div class="item" style="${past?'opacity:.5':''}">
      <div class="time" style="${past?'':n<=3?'background:var(--red);color:#fff':'background:var(--grad);color:#fff'}">${parseISO(e.date).toLocaleDateString('de-DE',{day:'2-digit',month:'short'})}</div>
      <span class="dot" style="background:${sColor(e.subject)}"></span>
      <div class="body"><strong>${esc(e.subject)}</strong><small>${esc(e.topic)} • ${parseISO(e.date).toLocaleDateString('de-DE',{weekday:'long'})}</small></div>
      <span class="tag ${past?'t-gray':n<=3?'t-red':n<=7?'t-amber':'t-blue'}">${past?'Vorbei':n===0?'Heute!':n===1?'Morgen':'In '+n+' Tagen'}</span>
      <button class="ghost" data-act="del-exam" data-id="${e.id}" title="Löschen">${ic('trash')}</button></div>`}).join(''):empty('exam','Keine Klausuren eingetragen.')}
  </section></div>`;
}

function renderGrades(){
  const avg=overallAvg();
  const subs=[...new Set(state.grades.map(g=>g.subject))].map(s=>[s,subjectAvg(s)]).sort((a,b)=>a[1]-b[1]);
  const recent=[...state.grades].sort((a,b)=>b.date.localeCompare(a.date));
  $('#v-grades').innerHTML=`<div class="grid">
    <section class="card s4" style="text-align:center">
      <div class="card-head" style="justify-content:center"><div class="card-title">Gesamtschnitt</div></div>
      <div class="ring">${avg?ringSvg((6-avg)/5,gColor(avg)):ringSvg(0,'#999')}<div class="mid"><b style="color:${avg?gColor(avg):'inherit'}">${avg?fmtNum(avg):'–'}</b><span>Ø aller Fächer</span></div></div>
      <p style="margin-top:16px;color:var(--muted);font-weight:600;font-size:.9rem">${!avg?'Trage deine erste Note ein.':avg<=1.5?'Spitzenleistung! 🏆':avg<=2.5?'Richtig stark, weiter so! 🚀':avg<=3.5?'Solide – da geht noch was! 💪':'Dranbleiben, du schaffst das! 📚'}</p>
    </section>
    <section class="card s8">
      <div class="card-head"><div class="card-title"><div class="ti">${ic('award')}</div>Schnitt pro Fach</div></div>
      ${subs.length?subs.map(([s,a])=>`<div class="subj-row"><span style="display:flex;align-items:center;gap:8px"><i class="dot" style="background:${sColor(s)}"></i>${esc(s)}</span><div class="bar"><i style="width:${(6-a)/5*100}%;background:${gColor(a)}"></i></div><span class="gv" style="background:${gColor(a)}22;color:${gColor(a)}">${fmtNum(a)}</span></div>`).join(''):empty('award','Noch keine Noten.')}
    </section>
    <section class="card s12">
      <div class="card-head"><div class="card-title"><div class="ti green">${ic('plus')}</div>Note eintragen</div></div>
      <form class="form" data-form="grade">
        <select name="subject">${subOptions('Mathe')}</select>
        <input class="grow" name="label" placeholder="Bezeichnung (z. B. Klassenarbeit)" required autocomplete="off">
        <select name="value">${GRADES.map(([l,v])=>`<option value="${v}" ${l==='2'?'selected':''}>Note ${l}</option>`).join('')}</select>
        <select name="weight"><option value="1">Gewicht ×1</option><option value="2">Gewicht ×2 (Klausur)</option><option value="3">Gewicht ×3</option></select>
        <input type="date" name="date" value="${iso(new Date())}" required>
        <button class="btn">${ic('plus')}Speichern</button>
      </form>
      ${recent.length?recent.map(g=>`<div class="item"><span class="dot" style="background:${sColor(g.subject)}"></span><div class="body"><strong>${esc(g.subject)} • ${esc(g.label)}</strong><small>${parseISO(g.date).toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'})} • Gewicht ×${g.weight}</small></div><span class="gv" style="background:${gColor(g.value)}22;color:${gColor(g.value)}">Note ${gLabel(g.value)}</span><button class="ghost" data-act="del-grade" data-id="${g.id}" title="Löschen">${ic('trash')}</button></div>`).join(''):empty('award','Noch keine Noten eingetragen.')}
    </section></div>`;
}

/* ================= Render / Navigation ================= */
let tab='home';
function chrome(){
  document.documentElement.dataset.theme=state.theme;
  const[a1,a2]=ACCENTS[state.accent%ACCENTS.length];
  document.documentElement.style.setProperty('--a1',a1);document.documentElement.style.setProperty('--a2',a2);
  $('#theme-btn').innerHTML=ic(state.theme==='dark'?'sun':'moon');
  $('#uname').textContent=state.name;$('#avatar').textContent=(state.name.trim()[0]||'?').toUpperCase();
  $('#subj-list').innerHTML=subjects().map(s=>`<option value="${esc(s)}">`).join('');
  const n=openTasks().length,b=$('#task-badge');b.hidden=!n;b.textContent=n;
  $('#sub-line').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
}
const R={home:renderHome,plan:renderPlan,tasks:renderTasks,exams:renderExams,grades:renderGrades};
function render(){chrome();Object.values(R).forEach(f=>f())}
function go(t){
  tab=t;$$('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+t));
  $$('.dk').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  scrollTo({top:0,behavior:'smooth'});try{history.replaceState(null,'','#'+t)}catch(e){}
}

/* ================= Fokus-Timer ================= */
const tm={mode:0,left:25*60,run:false,id:null};const MODES=[[25,'25 / 5'],[50,'50 / 10'],[15,'15 / 3']];
function timerUI(){
  const b=$('#tm-big');if(!b)return;
  b.textContent=`${String(Math.floor(tm.left/60)).padStart(2,'0')}:${String(tm.left%60).padStart(2,'0')}`;
  $('#tm-btn').innerHTML=tm.run?ic('pause')+'Pause':ic('play')+'Start';$('#tm-mode').textContent=MODES[tm.mode][1];
}
function timerToggle(){
  if(tm.run){clearInterval(tm.id);tm.run=false}
  else{tm.run=true;tm.id=setInterval(()=>{
    tm.left--;
    if(tm.left<=0){clearInterval(tm.id);tm.run=false;tm.left=MODES[tm.mode][0]*60;toast('Fokus-Zeit geschafft! Zeit für eine Pause ☕');confetti(innerWidth/2,200)}
    timerUI()},1000)}
  timerUI();
}

/* ================= Aktionen ================= */
let slot=null;
const actions={
  theme(){state.theme=state.theme==='dark'?'light':'dark';save();chrome()},
  accent(){state.accent=(state.accent+1)%ACCENTS.length;save();chrome()},
  rename(){const n=prompt('Wie heißt du?',state.name);if(n&&n.trim()){state.name=n.trim().slice(0,20);save();render();toast('Hallo '+state.name+'!')}},
  toggle(el,e){
    const t=state.tasks.find(x=>x.id===el.dataset.id);if(!t)return;
    t.done=!t.done;save();
    if(t.done){const r=el.getBoundingClientRect();confetti(r.left+30,r.top+20)}
    render();
  },
  'del-task'(el){state.tasks=state.tasks.filter(t=>t.id!==el.dataset.id);save();render();toast('Aufgabe gelöscht','trash')},
  'del-exam'(el){state.exams=state.exams.filter(t=>t.id!==el.dataset.id);save();render();toast('Klausur gelöscht','trash')},
  'del-grade'(el){state.grades=state.grades.filter(t=>t.id!==el.dataset.id);save();render();toast('Note gelöscht','trash')},
  'del-sub'(el){state.subs=state.subs.filter(t=>t.id!==el.dataset.id);save();render();toast('Eintrag gelöscht','trash')},
  tfilter(el){taskFilter=el.dataset.k;renderTasks()},
  slot(el){
    slot={d:+el.dataset.d,h:+el.dataset.h};const c=state.tt[slot.d][slot.h-1]||{};
    $('#dlg-title').textContent=`${DAYS[slot.d]} • ${slot.h}. Stunde (${P[slot.h-1][0]})`;
    $('#d-subj').value=c.s||'';$('#d-room').value=c.r||'';$('#d-teacher').value=c.t||'';
    $('#dlg').showModal();
  },
  'slot-save'(){
    const s=$('#d-subj').value.trim();
    state.tt[slot.d][slot.h-1]=s?{s,r:$('#d-room').value.trim(),t:$('#d-teacher').value.trim()}:null;
    save();$('#dlg').close();render();toast('Stundenplan gespeichert','tick');
  },
  'slot-clear'(){state.tt[slot.d][slot.h-1]=null;save();$('#dlg').close();render()},
  'slot-cancel'(){$('#dlg').close()},
  'tm-toggle':timerToggle,
  'tm-reset'(){clearInterval(tm.id);tm.run=false;tm.left=MODES[tm.mode][0]*60;timerUI()},
  'tm-mode'(){clearInterval(tm.id);tm.run=false;tm.mode=(tm.mode+1)%MODES.length;tm.left=MODES[tm.mode][0]*60;timerUI()}
};
document.addEventListener('click',e=>{
  const tabBtn=e.target.closest('[data-tab]');if(tabBtn){go(tabBtn.dataset.tab);return}
  const del=e.target.closest('.ghost[data-act]');
  const el=del||e.target.closest('[data-act]');if(!el)return;
  if(del)e.stopPropagation();
  const f=actions[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('submit',e=>{
  const form=e.target.closest('[data-form]');if(!form)return;
  e.preventDefault();const f=Object.fromEntries(new FormData(form));
  switch(form.dataset.form){
    case'task':state.tasks.push({id:uid(),subject:f.subject,text:f.text.trim(),due:f.due,prio:+f.prio,done:false});toast('Aufgabe hinzugefügt','check');break;
    case'exam':state.exams.push({id:uid(),subject:f.subject,topic:f.topic.trim(),date:f.date});toast('Klausur eingetragen','exam');break;
    case'grade':state.grades.push({id:uid(),subject:f.subject,label:f.label.trim(),value:+f.value,weight:+f.weight,date:f.date});toast('Note gespeichert','award');break;
    case'sub':state.subs.push({id:uid(),day:+f.day,hour:+f.hour,type:f.type,note:f.note.trim()});toast('Vertretung eingetragen','swap');break;
  }
  save();render();
});
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')$('#dlg').close()});

/* ================= Start ================= */
render();
const h0=(location.hash||'').slice(1);if(R[h0])go(h0);
setInterval(heroTick,1000);
</script>
</body>
</html>
